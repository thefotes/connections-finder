name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked
      - name: Byte-compile sources
        run: uv run python -m compileall -q pipeline app config.py run_all.py
      - name: Run tests
        run: uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          for f in app/static/app.js app/smoke_app.js pipeline/smoke_report.js; do
            node --check "$f"
          done
